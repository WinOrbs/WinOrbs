<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <meta name="description" content="Crea una nueva contraseña para tu cuenta de WinOrbs.">
  <title>Restablecer contraseña — WinOrbs</title>
  <link rel="stylesheet" href="css/arena.css">
  <style>
    html, body { min-height: 100%; }
    body { min-height: 100vh; overflow-x: hidden; }
    #reset-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("assets/login/loginbg.jpg") center / cover no-repeat;
      opacity: .25;
      filter: saturate(.75);
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at 50% 0%, rgba(6, 10, 18, .12), rgba(3, 6, 12, .84));
      pointer-events: none;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .reset-card {
      width: min(100%, 420px);
      padding: 28px clamp(20px, 6vw, 34px) 26px;
      text-align: center;
      background: rgba(8, 13, 26, .82);
      border-color: rgba(56, 189, 248, .24);
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .9), 0 0 42px -22px rgba(56, 189, 248, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
      animation: card-in .45s cubic-bezier(.2, .75, .3, 1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand { display: inline-flex; justify-content: center; margin-bottom: 12px; }
    .brand img { display: block; width: min(100%, 250px); height: 78px; object-fit: contain; }
    h1 {
      margin: 0 0 7px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 25px;
      line-height: 1.15;
    }
    .intro { margin: 0 auto 20px; max-width: 32ch; color: var(--muted); line-height: 1.45; }
    .account { margin: -8px 0 17px; color: var(--cyan); font-weight: 600; overflow-wrap: anywhere; }
    form { display: grid; gap: 12px; text-align: left; }
    .field { display: grid; gap: 6px; }
    label { margin-left: 2px; }
    input { min-height: 46px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .status { display: none; margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .status.visible { display: block; }
    .status[data-kind="info"] { color: var(--cyan); background: rgba(56, 189, 248, .08); border: 1px solid rgba(56, 189, 248, .22); }
    .status[data-kind="success"] { color: #7dffa8; background: rgba(34, 197, 94, .1); border: 1px solid rgba(34, 197, 94, .28); }
    .status[data-kind="error"] { color: #ff9a9a; background: rgba(248, 113, 113, .1); border: 1px solid rgba(248, 113, 113, .3); }
    .actions { margin-top: 16px; }
    .btn { display: block; text-decoration: none; text-align: center; }
    .btn[hidden], form[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .reset-card { animation: none; }
    }
  </style>
</head>
<body>
  <div id="reset-bg" aria-hidden="true"></div>
  <div class="atmo" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="atmo-grid"></div>
    <div class="atmo-vignette"></div>
    <div class="atmo-grain"></div>
  </div>
  <main>
    <section class="reset-card panel" aria-labelledby="page-title">
      <a class="brand" href="login.html" aria-label="WinOrbs, ir al inicio de sesión">
        <img src="assets/login/logo-login.png" alt="WinOrbs">
      </a>
      <h1 id="page-title">Restablecer contraseña</h1>
      <p class="intro" id="intro">Estamos verificando el enlace de recuperación.</p>
      <p class="account" id="account" hidden></p>
      <p class="status visible" id="status" data-kind="info" role="status" aria-live="polite">Verificando enlace…</p>

      <form id="reset-form" hidden novalidate>
        <div class="field">
          <label for="new-password">Nueva contraseña</label>
          <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="6" required>
          <span class="hint">Usa al menos 6 caracteres.</span>
        </div>
        <div class="field">
          <label for="confirm-password">Confirma la contraseña</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="btn" id="submit-button" type="submit">Guardar contraseña</button>
      </form>
      <div class="actions">
        <a class="btn sec" id="login-link" href="login.html" hidden>Volver a iniciar sesión</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const actionCode = params.get("oobCode");
    const actionApiKey = params.get("apiKey");
    window.history.replaceState({}, document.title, window.location.pathname);

    const status = document.getElementById("status");
    const intro = document.getElementById("intro");
    const account = document.getElementById("account");
    const form = document.getElementById("reset-form");
    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");
    const submitButton = document.getElementById("submit-button");
    const loginLink = document.getElementById("login-link");

    function showStatus(message, kind) {
      status.textContent = message;
      status.dataset.kind = kind;
      status.classList.add("visible");
    }

    function showInvalidLink(error) {
      console.error("WinOrbs password reset link verification failed", {
        code: error && typeof error.code === "string" ? error.code : null
      });
      intro.textContent = "Este enlace ya no es válido o ha caducado.";
      showStatus("Solicita un nuevo correo de recuperación e inténtalo otra vez.", "error");
      loginLink.hidden = false;
    }

    if (mode !== "resetPassword" || !actionCode || (actionApiKey && actionApiKey !== firebaseConfig.apiKey)) {
      showInvalidLink({ code: "auth/invalid-action-code" });
    } else {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      try {
        const email = await verifyPasswordResetCode(auth, actionCode);
        account.textContent = email;
        account.hidden = false;
        intro.textContent = "Crea una contraseña nueva para tu cuenta.";
        status.classList.remove("visible");
        form.hidden = false;
        newPassword.focus();
      } catch (error) {
        showInvalidLink(error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.classList.remove("visible");
      const password = newPassword.value;
      if (password.length < 6) {
        showStatus("La contraseña debe tener al menos 6 caracteres.", "error");
        newPassword.focus();
        return;
      }
      if (password !== confirmPassword.value) {
        showStatus("Las contraseñas no coinciden.", "error");
        confirmPassword.focus();
        return;
      }

      submitButton.disabled = true;
      try {
        await confirmPasswordReset(getAuth(), actionCode, password);
        form.hidden = true;
        account.hidden = true;
        intro.textContent = "Tu contraseña se actualizó correctamente.";
        showStatus("Ya puedes iniciar sesión con tu nueva contraseña.", "success");
        loginLink.hidden = false;
      } catch (error) {
        console.error("WinOrbs password reset confirmation failed", {
          code: error && typeof error.code === "string" ? error.code : null
        });
        const message = error && error.code === "auth/weak-password"
          ? "La contraseña es demasiado débil. Prueba con otra."
          : error && error.code === "auth/expired-action-code"
            ? "El enlace ha caducado. Solicita otro desde la pantalla de inicio de sesión."
            : error && error.code === "auth/invalid-action-code"
              ? "El enlace ya se utilizó o dejó de ser válido. Solicita uno nuevo."
              : "No se pudo actualizar la contraseña. Comprueba tu conexión e inténtalo de nuevo.";
        showStatus(message, "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
