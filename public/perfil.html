<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <title>WinOrbs — Mi Perfil</title>
  <!-- Design System Neón Arena compartido -->
  <link rel="stylesheet" href="/css/arena.css">
  <style>
    /* ── Neón Arena: la base (vars, atmósfera, formularios, botones, msgs) vive en /css/arena.css ── */
    body { padding: 20px; }

    .profile-layout {
      width: min(1180px, 100%); margin: 0 auto;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      gap: 18px; align-items: start;
    }

    .top-bar {
      max-width: 560px; margin: 0 auto 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .top-bar a {
      color: var(--muted); font-family: var(--font-display); font-weight: 600;
      font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
      text-decoration: none; transition: color .2s, text-shadow .2s;
    }
    .top-bar a:hover { color: var(--cyan); text-shadow: 0 0 12px rgba(56, 189, 248, .4); }

    .saldo-chip {
      background: rgba(34, 197, 94, .1); color: #7dffa8;
      border: 1px solid rgba(34, 197, 94, .35);
      font-family: var(--font-display); font-weight: 700;
      padding: 5px 14px; border-radius: 999px; font-size: 13.5px;
      text-shadow: 0 0 14px rgba(34, 197, 94, .4);
      animation: saldoPulse 3.2s ease-in-out infinite;
    }
    @keyframes saldoPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
      50% { box-shadow: 0 0 18px rgba(34, 197, 94, .3); }
    }

    .card {
      min-width: 0; margin: 0;
      background: var(--surface);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 24px;
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .05);
    }
    h1 { font-family: var(--font-display); font-size: 21px; letter-spacing: 1px; margin-bottom: 2px; }
    h2 {
      font-family: var(--font-display); font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px; color: var(--cyan);
      margin: 24px 0 6px;
    }
    h2::before { content: "// "; color: var(--muted); }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }

    .history-card { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
    .history-card h2 { margin-top: 0; }
    .history-status { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .history-list { display: grid; gap: 10px; }
    .history-match {
      border: 1px solid var(--line); border-radius: 12px;
      background: rgba(255, 255, 255, .025); overflow: hidden;
    }
    .history-match summary {
      cursor: pointer; list-style: none; padding: 12px;
      display: grid; gap: 5px; color: var(--text);
    }
    .history-match summary::-webkit-details-marker { display: none; }
    .history-match summary:hover { background: rgba(56, 189, 248, .06); }
    .history-match-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; }
    .history-match-meta { color: var(--muted); font-size: 11px; }
    .history-leaderboard { margin: 0; padding: 0 12px 12px 34px; }
    .history-leaderboard li { padding: 5px 0; color: var(--muted); font-size: 12px; }
    .history-leaderboard li:first-child { color: #f5c84c; font-weight: 700; }
    .history-player-stats { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
    #btn-historial-mas { margin-top: 12px; }

    @media (max-width: 850px) {
      .profile-layout { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
      .history-card { position: static; max-height: none; }
    }
  </style>
</head>
<body>
  <div class="atmo" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="orb orb-d"></div>
    <div class="atmo-grid"></div>
    <div class="atmo-vignette"></div>
    <div class="atmo-grain"></div>
  </div>
  <div class="top-bar">
    <a href="index.html">← Volver al lobby</a>
    <span class="saldo-chip" id="chip-saldo">$0.00</span>
  </div>

  <main class="profile-layout">
  <section class="card">
    <h1>👤 Mi Perfil</h1>
    <p class="sub" id="sub-cuenta">Cargando sesión…</p>
    <div class="msg" id="msg"></div>

    <h2>Datos personales (se usan para tus pagos)</h2>
    <label>Nombre de usuario (apodo en el juego)</label>
    <input type="text" id="f-apodo" maxlength="16" placeholder="Ej: ProOrb99">
    <label>Cédula (solo números, máx. 8 dígitos)</label>
    <input type="text" id="f-cedula" maxlength="8" inputmode="numeric" placeholder="Ej: 12345678">
    <label>Teléfono (11 dígitos, con operadora)</label>
    <input type="text" id="f-telefono" maxlength="11" inputmode="numeric" placeholder="Ej: 04121234567">
    <label>Banco (para transferencias)</label>
    <input type="text" id="f-banco" maxlength="40" placeholder="Ej: Banesco">
    <label>Dirección de billetera USDT (red TRC20 o BEP20)</label>
    <input type="text" id="f-billetera" maxlength="42" autocomplete="off" spellcheck="false" placeholder="Ej: TQ5pR9… (TRC20) o 0x71C7… (BEP20)">
    <button class="btn" id="btn-guardar">Guardar datos</button>

    <h2>Cuenta</h2>
    <label>Email</label>
    <input type="email" id="f-email" readonly>
    <div id="zona-password">
      <label>Contraseña actual</label>
      <input type="password" id="f-pass-actual" autocomplete="current-password">
      <label>Nueva contraseña (mínimo 6 caracteres)</label>
      <input type="password" id="f-pass-nueva" autocomplete="new-password">
      <button class="btn" id="btn-password">Cambiar contraseña</button>
    </div>
    <div id="zona-vincular" style="display: none;">
      <p class="sub" style="margin: 8px 0 0;">Estás jugando como invitado. Vincula un email para no perder tu saldo:</p>
      <label>Email</label>
      <input type="email" id="f-vinc-email" autocomplete="email">
      <label>Contraseña nueva (mínimo 6)</label>
      <input type="password" id="f-vinc-pass" autocomplete="new-password">
      <button class="btn" id="btn-vincular">Vincular email a esta cuenta</button>
    </div>

    <button class="btn sec" id="btn-salir">Cerrar sesión</button>
  </section>

  <aside class="card history-card" aria-labelledby="historial-titulo">
    <h2 id="historial-titulo">Historial de partidas</h2>
    <p class="history-status" id="historial-estado" role="status" aria-live="polite">
      Inicia sesión para consultar tus resultados.
    </p>
    <div class="history-list" id="historial-lista"></div>
    <button class="btn sec" id="btn-historial-mas" type="button" hidden>
      Cargar más partidas
    </button>
  </aside>
  </main>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="/js/servidor-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      reauthenticateWithCredential,
      updatePassword,
      EmailAuthProvider,
      linkWithCredential
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const socket = window.io(window.SERVIDOR_URL || undefined, { transports: ["websocket"] });

    const $ = (id) => document.getElementById(id);
    const historyState = {
      cursorId: null,
      loading: false,
      initialized: false,
      retryFromFirstPage: false
    };

    function msg(texto, tipo) {
      const m = $("msg");
      m.textContent = texto;
      m.className = "msg " + tipo;
      setTimeout(() => { m.className = "msg"; m.textContent = ""; }, 5000);
    }

    function limpiar(texto) { return (texto || "").replace(/[<>&"'`]/g, "").trim(); }
    function soloDigitos(texto) { return (texto || "").replace(/\D/g, ""); }

    // Solo números en cédula (máx. 8) y teléfono (máx. 11, con operadora)
    $("f-cedula").addEventListener("input", (e) => { e.target.value = soloDigitos(e.target.value).slice(0, 8); });
    $("f-telefono").addEventListener("input", (e) => { e.target.value = soloDigitos(e.target.value).slice(0, 11); });

    let usuarioActual = null;

    // Guard de sesión + carga del perfil
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      usuarioActual = user;

      $("f-email").value = user.email || "— invitado (sin email) —";
      $("sub-cuenta").textContent = "UID: " + user.uid.substring(0, 10) + "…";

      const esInvitado = !user.email;
      $("zona-password").style.display = esInvitado ? "none" : "block";
      $("zona-vincular").style.display = esInvitado ? "block" : "none";

      try {
        const snap = await getDoc(doc(db, "usuarios", user.uid));
        if (snap.exists()) {
          const p = snap.data();
          $("f-apodo").value = p.apodo || "";
          $("f-cedula").value = soloDigitos(p.cedula).slice(0, 8);
          $("f-telefono").value = soloDigitos(p.telefono).slice(0, 11);
          $("f-banco").value = p.banco || "";
          $("f-billetera").value = String(p.billetera_usdt || "");
          $("chip-saldo").textContent = "$" + Number(p.saldo || 0).toFixed(2);
        }
      } catch (e) {
        msg("No se pudo cargar el perfil: " + (e.code || e.message), "err");
      }
      if (!historyState.initialized) {
        historyState.initialized = true;
        await cargarHistorial(true);
      }
    });

    function fechaPartida(timestamp) {
      if (!Number.isFinite(timestamp)) return "Fecha no disponible";
      return new Intl.DateTimeFormat("es", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(timestamp));
    }

    function renderizarPartida(match) {
      const details = document.createElement("details");
      details.className = "history-match";
      const summary = document.createElement("summary");
      const title = document.createElement("span");
      title.className = "history-match-title";
      const winner = match.leaderboard?.[0]?.nick || "Sin ganador";
      title.textContent = `${match.roomName || "Partida"} · 1.º ${winner}`;
      const meta = document.createElement("span");
      meta.className = "history-match-meta";
      const mode = match.isPractice ? "Práctica SOLO" : (match.mode === "teams" ? "Equipos" : "FFA");
      meta.textContent = `${fechaPartida(match.finishedAt)} · ${mode} · ${match.leaderboard.length} participantes`;
      summary.append(title, meta);
      details.appendChild(summary);

      const leaderboard = document.createElement("ol");
      leaderboard.className = "history-leaderboard";
      match.leaderboard.forEach((player) => {
        const row = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = `${player.position}. ${player.nick}${player.isBot ? " (BOT)" : ""}`;
        const stats = document.createElement("span");
        stats.className = "history-player-stats";
        stats.textContent = `${player.score} pts asegurados · ${player.eliminations} kills`;
        row.append(name, stats);
        leaderboard.appendChild(row);
      });
      details.appendChild(leaderboard);
      return details;
    }

    async function cargarHistorial(reset = false) {
      if (!usuarioActual || historyState.loading || !socket) return;
      historyState.loading = true;
      const button = $("btn-historial-mas");
      button.disabled = true;
      $("historial-estado").textContent = reset ? "Cargando tus partidas…" : "Cargando más partidas…";
      if (reset) {
        historyState.cursorId = null;
        $("historial-lista").replaceChildren();
      }
      try {
        const token = await usuarioActual.getIdToken();
        const response = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error("HISTORY_TIMEOUT")), 10000);
          socket.timeout(9000).emit("pedirHistorialPartidas", {
            token,
            cursorId: historyState.cursorId
          }, (timeoutError, result) => {
            clearTimeout(timeout);
            if (timeoutError) reject(new Error("HISTORY_TIMEOUT"));
            else resolve(result);
          });
        });
        if (!response?.ok) {
          if (response?.error === "NO_AUTH") throw new Error("NO_AUTH");
          if (response?.error === "RATE_LIMIT") throw new Error("RATE_LIMIT");
          if (response?.error === "INVALID_CURSOR") throw new Error("INVALID_CURSOR");
          if (response?.error === "INDEX_REQUIRED") throw new Error("INDEX_REQUIRED");
          if (response?.error === "FIRESTORE_ACCESS") throw new Error("FIRESTORE_ACCESS");
          throw new Error("HISTORY_UNAVAILABLE");
        }
        const list = $("historial-lista");
        response.matches.forEach((match) => list.appendChild(renderizarPartida(match)));
        historyState.cursorId = response.nextCursor;
        historyState.retryFromFirstPage = false;
        button.hidden = !historyState.cursorId;
        button.textContent = "Cargar más partidas";
        $("historial-estado").textContent = list.childElementCount
          ? "Selecciona una partida para ver la clasificación completa."
          : "Aún no hay partidas guardadas para esta cuenta. El historial comienza con las partidas terminadas desde esta actualización.";
      } catch (error) {
        const messages = {
          NO_AUTH: "No se pudo verificar tu sesión. Vuelve a iniciar sesión e inténtalo de nuevo.",
          RATE_LIMIT: "Espera un momento antes de volver a solicitar el historial.",
          INVALID_CURSOR: "La página del historial expiró. Vuelve a cargar la lista.",
          INDEX_REQUIRED: "Falta habilitar el índice de historial en Firestore. Despliega firestore.indexes.json y espera a que el índice esté activo.",
          FIRESTORE_ACCESS: "El servidor no tiene acceso a Firestore. Revisa las credenciales Firebase Admin de Render.",
          HISTORY_UNAVAILABLE: "No se pudo consultar Firestore. Comprueba la conexión del servidor e inténtalo de nuevo."
        };
        $("historial-estado").textContent = messages[error.message] || messages.HISTORY_UNAVAILABLE;
        if (error.message === "INVALID_CURSOR") historyState.retryFromFirstPage = true;
        button.hidden = false;
        button.textContent = error.message === "INVALID_CURSOR" ? "Recargar historial" : "Reintentar";
        if (error.message === "HISTORY_TIMEOUT") {
          $("historial-estado").textContent = "El servidor tardó demasiado. Puedes volver a intentarlo.";
        }
      } finally {
        historyState.loading = false;
        button.disabled = false;
      }
    }

    $("btn-historial-mas").addEventListener("click", () => {
      const restart = historyState.retryFromFirstPage;
      historyState.retryFromFirstPage = false;
      cargarHistorial(restart);
    });

    // Valida el formato de un apodo. Devuelve el mensaje de error o null.
    // Solo se bloquea lo que REALMENTE rompe la reserva apodos/{clave}: '/' no
    // puede ir en un ID de documento, los IDs '__x__' son reservados por
    // Firestore, y < > & " los rechazan las reglas. Letras con acento, ñ y
    // espacios siguen permitidos (apodos antiguos siguen funcionando).
    function motivoApodoInvalido(apodo) {
      const s = String(apodo || "").trim();
      if (s.length < 3) return "El nombre de usuario debe tener al menos 3 caracteres.";
      if (s.length > 16) return "El nombre de usuario no puede superar 16 caracteres.";
      if (s.indexOf("/") !== -1) return "El nombre de usuario no puede contener '/'.";
      if (/^__.*__$/.test(s) || s === "." || s === "..") return "Ese nombre de usuario está reservado por el sistema. Elige otro.";
      if (/[<>&"]/.test(s)) return "El nombre de usuario no puede contener los caracteres < > & \".";
      return null;
    }

    // Guardar datos personales (el apodo es ÚNICO: reserva atómica en apodos/{lower})
    $("btn-guardar").addEventListener("click", async () => {
      if (!usuarioActual) return;
      const apodo = limpiar($("f-apodo").value);
      const malApodo = motivoApodoInvalido(apodo);
      if (malApodo) return msg(malApodo, "err");
      // Billetera USDT opcional: TRC20 (T + 33 base58) o BEP20 (0x + 40 hex)
      const billeteraCruda = limpiar($("f-billetera").value);
      let billeteraFinal = "";
      if (billeteraCruda) {
        const esTRC20 = /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(billeteraCruda);
        const esBEP20 = /^0x[a-fA-F0-9]{40}$/.test(billeteraCruda);
        if (!esTRC20 && !esBEP20) {
          return msg("La dirección USDT no es válida: TRC20 empieza con T (34 caracteres) o BEP20 con 0x (42 caracteres).", "err");
        }
        billeteraFinal = billeteraCruda;
      }
      $("btn-guardar").disabled = true;
      try {
        const refYo = doc(db, "usuarios", usuarioActual.uid);
        const snapYo = await getDoc(refYo);
        const perfilYo = snapYo.exists() ? (snapYo.data() || {}) : {};
        const apodoAnterior = String(perfilYo.apodo || "");
        const claveNueva = apodo.trim().toLowerCase();
        const claveVieja = apodoAnterior.trim().toLowerCase();
        const apodoCambia = apodo !== apodoAnterior;          // incluye solo-mayúsculas
        const sinReserva = !perfilYo.apodoLower;              // perfil antiguo

        // 1) Reserva el apodo si cambia (aunque solo sean mayúsculas/espacios) o
        //    si el perfil es antiguo y todavía no tenía reserva. Es idempotente
        //    cuando la reserva ya es tuya, y falla si es de otro usuario.
        if (apodoCambia || sinReserva) {
          await runTransaction(db, async (t) => {
            const refA = doc(db, "apodos", claveNueva);
            const snapA = await t.get(refA);
            if (snapA.exists() && snapA.data().uid !== usuarioActual.uid) {
              throw new Error("APODO_EN_USO");
            }
            t.set(refA, { uid: usuarioActual.uid, apodo: apodo });
          });
        }

        // 2) Actualiza el perfil (las reglas exigen que el apodo esté reservado)
        await updateDoc(refYo, {
          apodo: apodo,
          apodoLower: claveNueva,
          cedula: soloDigitos($("f-cedula").value),
          telefono: soloDigitos($("f-telefono").value),
          banco: limpiar($("f-banco").value),
          billetera_usdt: billeteraFinal,
          actualizadoEn: serverTimestamp()
        });

        // 3) Libera la reserva del apodo viejo (best-effort, solo si cambió la clave)
        if (claveVieja && claveVieja !== claveNueva) {
          try {
            await runTransaction(db, async (t) => {
              const refV = doc(db, "apodos", claveVieja);
              const snapV = await t.get(refV);
              if (snapV.exists() && snapV.data().uid === usuarioActual.uid) t.delete(refV);
            });
          } catch (eLib) { /* best-effort */ }
        }
        try { localStorage.setItem("ode_user", apodo); } catch (e) { }
        msg("Datos guardados correctamente.", "ok");
      } catch (e) {
        if (e && e.message === "APODO_EN_USO") {
          msg("Ese nombre de usuario ya está en uso. Elige otro.", "err");
        } else if (e && e.code === "permission-denied") {
          msg("No se pudo guardar: revisa que firestore.rules esté publicado (colección 'apodos' incluida).", "err");
        } else {
          msg("No se pudo guardar: " + (e.code || e.message), "err");
        }
      }
      $("btn-guardar").disabled = false;
    });

    // Cambiar contraseña (requiere re-autenticación reciente)
    $("btn-password").addEventListener("click", async () => {
      if (!usuarioActual || !usuarioActual.email) return;
      const actual = $("f-pass-actual").value;
      const nueva = $("f-pass-nueva").value;
      if (!actual || nueva.length < 6) return msg("Completa la contraseña actual y la nueva (mínimo 6).", "err");
      $("btn-password").disabled = true;
      try {
        const cred = EmailAuthProvider.credential(usuarioActual.email, actual);
        await reauthenticateWithCredential(usuarioActual, cred);
        await updatePassword(usuarioActual, nueva);
        $("f-pass-actual").value = "";
        $("f-pass-nueva").value = "";
        msg("Contraseña actualizada correctamente.", "ok");
      } catch (e) {
        if (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password") {
          msg("La contraseña actual no es correcta.", "err");
        } else {
          msg("No se pudo cambiar la contraseña: " + (e.code || e.message), "err");
        }
      }
      $("btn-password").disabled = false;
    });

    // Invitado: vincular email y contraseña a esta cuenta (conserva saldo)
    $("btn-vincular").addEventListener("click", async () => {
      if (!usuarioActual) return;
      const email = limpiar($("f-vinc-email").value).toLowerCase();
      const pass = $("f-vinc-pass").value;
      if (!email.includes("@") || pass.length < 6) return msg("Email válido y contraseña de al menos 6 caracteres.", "err");
      $("btn-vincular").disabled = true;
      try {
        const cred = EmailAuthProvider.credential(email, pass);
        await linkWithCredential(usuarioActual, cred);
        await updateDoc(doc(db, "usuarios", usuarioActual.uid), { email: email });
        msg("Email vinculado. Ya puedes iniciar sesión con él.", "ok");
        $("f-email").value = email;
        $("zona-vincular").style.display = "none";
        $("zona-password").style.display = "block";
      } catch (e) {
        if (e.code === "auth/email-already-in-use") {
          msg("Ese email ya está en uso por otra cuenta.", "err");
        } else {
          msg("No se pudo vincular: " + (e.code || e.message), "err");
        }
      }
      $("btn-vincular").disabled = false;
    });

    // Cerrar sesión
    $("btn-salir").addEventListener("click", async () => {
      try { await signOut(auth); } catch (e) { }
      try {
        localStorage.removeItem("ode_uid");
        localStorage.removeItem("ode_user");
      } catch (e) { }
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
